<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Terminology - Combating Cybercrime</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            --panel-bg: rgba(30, 41, 59, 0.85);
            --panel-border: #334155;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --accent-blue: #38bdf8;
            --accent-blue-hover: #0284c7;
            --accent-green: #34d399;
            --accent-green-hover: #059669;
            --accent-red: #f87171;
            --accent-purple: #818cf8;
            --accent-purple-hover: #4f46e5;
            --accent-amber: #fbbf24;

            --fs-h1: clamp(1.25rem, 3vw + 0.5rem, 2rem);
            --fs-h2: clamp(1.1rem, 2vw + 0.5rem, 1.35rem);
            --fs-term-en: clamp(1.25rem, 3vw + 0.5rem, 1.75rem);
            --fs-term-def: clamp(0.9rem, 1.5vw + 0.5rem, 1.1rem);
            --fs-term-ru: clamp(1.1rem, 2vw + 0.5rem, 1.35rem);
            --fs-quiz-q: clamp(0.95rem, 2vw + 0.5rem, 1.15rem);
            --fs-btn: clamp(0.85rem, 1vw + 0.5rem, 0.95rem);
            --fs-small: clamp(0.75rem, 1vw + 0.25rem, 0.85rem);

            --space-xs: clamp(0.25rem, 0.5vw, 0.5rem);
            --space-sm: clamp(0.5rem, 1vw, 0.75rem);
            --space-md: clamp(0.75rem, 1.5vw, 1.25rem);
            --space-lg: clamp(1rem, 2vw, 1.5rem);
            --space-xl: clamp(1.5rem, 3vw, 2rem);

            --container-width: clamp(300px, 92vw, 940px);
            --border-radius: clamp(8px, 1vw, 12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--space-lg) var(--space-sm);
            line-height: 1.45;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .hidden { display: none !important; }

        header {
            text-align: center;
            margin-bottom: var(--space-lg);
            width: 100%;
        }

        h1 {
            font-size: var(--fs-h1);
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-xs);
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

        .subtitle {
            font-size: var(--fs-btn);
            color: var(--text-muted);
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: var(--border-radius);
            padding: var(--space-lg);
            width: var(--container-width);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.3s ease-out;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            gap: var(--space-md);
            margin-top: var(--space-md);
        }

        .menu-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: var(--border-radius);
            padding: var(--space-md);
            color: var(--text-main);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-sm);
        }

        .menu-btn i { font-size: clamp(1.5rem, 3vw, 2rem); }
        .menu-btn h3 { font-size: var(--fs-h2); }
        .menu-btn p { font-size: var(--fs-small); color: var(--text-muted); }

        .menu-btn.term-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(56, 189, 248, 0.15);
        }
        .menu-btn.term-btn i { color: var(--accent-blue); }

        .menu-btn.match-btn:hover {
            border-color: var(--accent-green);
            background: rgba(52, 211, 153, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(52, 211, 153, 0.15);
        }
        .menu-btn.match-btn i { color: var(--accent-green); }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-sm);
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: var(--space-sm);
            margin-bottom: var(--space-md);
            flex-wrap: wrap;
        }

        .top-bar h2 {
            font-size: var(--fs-h2);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .progress-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--panel-border);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: var(--fs-small);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .home-link {
            color: var(--text-muted);
            text-decoration: underline;
            font-size: var(--fs-small);
            background: none;
            padding: 0;
        }
        .home-link:hover { color: var(--text-main); }

        .term-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 25vh;
            justify-content: center;
        }

        .term-en {
            font-size: var(--fs-term-en);
            color: var(--accent-blue);
            font-weight: 800;
            margin-bottom: var(--space-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .term-def {
            font-size: var(--fs-term-def);
            color: var(--text-muted);
            max-width: 95%;
            margin-bottom: var(--space-lg);
        }

        .speak-btn {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.35);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .speak-btn:hover { background: rgba(56, 189, 248, 0.25); transform: scale(1.06); }

        .reveal-btn {
            background: var(--accent-purple);
            color: white;
            font-size: var(--fs-btn);
            font-weight: bold;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(129, 140, 248, 0.3);
        }
        .reveal-btn:hover { background: var(--accent-purple-hover); transform: scale(1.02); }

        .translation-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--accent-green);
            border-radius: var(--border-radius);
            padding: var(--space-sm) var(--space-md);
            width: 100%;
            margin-top: var(--space-md);
            animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .translation-label {
            font-size: var(--fs-small);
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .term-ru {
            font-size: var(--fs-term-ru);
            font-weight: bold;
            color: var(--text-main);
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            margin-top: var(--space-md);
            padding-top: var(--space-sm);
            border-top: 1px solid var(--panel-border);
        }

        .nav-btn {
            background: rgba(51, 65, 85, 0.5);
            color: var(--text-main);
            padding: var(--space-xs) var(--space-sm);
            border-radius: 6px;
            font-size: var(--fs-btn);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }
        .nav-btn:hover:not(:disabled) { background: rgba(51, 65, 85, 1); }
        .nav-btn.primary { background: var(--accent-blue); color: #000; font-weight: bold; }
        .nav-btn.primary:hover:not(:disabled) { background: var(--accent-blue-hover); color: #fff; }

        .quiz-question-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: var(--border-radius);
            padding: var(--space-sm) var(--space-md);
            margin-bottom: var(--space-md);
        }

        .quiz-label {
            font-size: var(--fs-small);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .quiz-question {
            font-size: var(--fs-quiz-q);
            color: var(--text-main);
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
            gap: var(--space-sm);
        }

        .option-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: var(--space-sm) var(--space-md);
            border-radius: 8px;
            font-size: var(--fs-btn);
            text-align: left;
            font-weight: 500;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--accent-blue);
            transform: translateX(3px);
            box-shadow: -3px 0 0 var(--accent-blue);
        }
        .option-btn.correct { background: var(--accent-green-hover); border-color: var(--accent-green); color: white; }
        .option-btn.wrong { background: var(--accent-red); border-color: #dc2626; color: white; }

        .timer-badge { color: var(--accent-amber); border-color: rgba(251, 191, 36, 0.4); }
        .timer-badge.danger { color: var(--accent-red); border-color: rgba(248, 113, 113, 0.5); animation: pulse 1s infinite; }

        .results-content { text-align: center; padding: var(--space-md) 0; }
        .results-icon {
            font-size: clamp(3rem, 6vw, 4rem);
            color: #facc15;
            margin-bottom: var(--space-sm);
            filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.3));
        }

        .score-box {
            display: inline-block;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--panel-border);
            border-radius: var(--border-radius);
            padding: var(--space-sm) var(--space-lg);
            margin: var(--space-sm) 0;
        }
        .score-number { font-size: clamp(2.5rem, 5vw, 3.5rem); font-weight: 900; color: var(--accent-blue); line-height: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-shield-halved"></i> Combating Cybercrime</h1>
        <p class="subtitle">Module 2: Professional Terminology</p>
    </header>

    <!-- MAIN MENU -->
    <main id="main-menu" class="glass-panel">
        <h2 style="font-size: var(--fs-h2); text-align: center; margin-bottom: var(--space-xs);">Select Training Mode:</h2>
        <div class="menu-grid">
            <button onclick="startTerminology()" class="menu-btn term-btn">
                <i class="fa-solid fa-book-open"></i>
                <h3>1. Types of Cybercrimes</h3>
                <p>Study 16 cybercrime terms: English definition, Russian equivalent, and British pronunciation.</p>
            </button>

            <button onclick="startMatching()" class="menu-btn match-btn">
                <i class="fa-solid fa-stopwatch"></i>
                <h3>2. Term &amp; Definition Match</h3>
                <p>60 seconds. Read the definition and choose the correct term. One point for every correct answer.</p>
            </button>
        </div>
    </main>

    <!-- MODE 1: TERMINOLOGY STUDY -->
    <main id="term-container" class="glass-panel hidden">
        <div class="top-bar">
            <h2 style="color: var(--accent-blue);"><i class="fa-solid fa-graduation-cap"></i> Types of Cybercrimes</h2>
            <div class="top-bar-right">
                <span id="term-progress" class="progress-badge">1/16</span>
                <button onclick="showMenu()" class="home-link"><i class="fa-solid fa-house"></i> Menu</button>
            </div>
        </div>

        <div class="term-content">
            <div id="term-en" class="term-en"></div>
            <div id="term-def" class="term-def"></div>

            <button id="btn-reveal" onclick="revealTranslation()" class="reveal-btn">
                <i class="fa-solid fa-eye"></i> Show Russian Translation
            </button>

            <div id="term-ru-container" class="translation-box hidden">
                <div class="translation-label">Russian Translation:</div>
                <div id="term-ru" class="term-ru"></div>
            </div>
        </div>

        <div class="nav-controls">
            <button id="btn-prev-term" onclick="prevTerm()" class="nav-btn">
                <i class="fa-solid fa-arrow-left"></i> Previous
            </button>
            <button id="btn-next-term" onclick="nextTerm()" class="nav-btn primary">
                Next <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </main>

    <!-- MODE 2: TIMED MATCHING -->
    <main id="match-container" class="glass-panel hidden">
        <div class="top-bar">
            <h2 style="color: var(--accent-green);"><i class="fa-solid fa-stopwatch"></i> Term &amp; Definition Match</h2>
            <div class="top-bar-right">
                <span id="match-score" class="progress-badge" style="color: var(--accent-green); border-color: var(--accent-green);">Score: 0</span>
                <span id="match-timer" class="progress-badge timer-badge">01:00</span>
                <span id="match-progress" class="progress-badge">1/16</span>
                <button onclick="showMenu()" class="home-link"><i class="fa-solid fa-house"></i> Menu</button>
            </div>
        </div>

        <div class="quiz-question-box">
            <div class="quiz-label"><i class="fa-solid fa-file-lines"></i> Definition:</div>
            <div id="match-question" class="quiz-question"></div>
        </div>

        <div id="match-options" class="quiz-options">
            <!-- Options generated by JS -->
        </div>
    </main>

    <!-- RESULTS SCREEN -->
    <main id="results-container" class="glass-panel hidden">
        <div class="results-content">
            <i class="fa-solid fa-trophy results-icon"></i>
            <h2 style="font-size: var(--fs-h1); margin-bottom: var(--space-xs);">Time Is Up!</h2>
            <p style="font-size: var(--fs-btn); color: var(--text-muted);">Here is your terminology report.</p>

            <div class="score-box">
                <div style="font-size: var(--fs-small); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Final Score</div>
                <div id="res-score" class="score-number">0</div>
            </div>
            <div id="res-detail" style="font-size: var(--fs-small); color: var(--text-muted); margin-bottom: var(--space-sm);">0 correct / 0 incorrect</div>

            <div style="width: 100%; background: rgba(15,23,42,0.8); border-radius: 6px; height: 8px; margin-bottom: 4px; overflow: hidden;">
                <div id="res-bar" style="height: 100%; width: 0%; background: var(--accent-green); transition: width 1s ease;"></div>
            </div>
            <div id="res-percent" style="text-align: right; font-size: var(--fs-small); color: var(--text-muted); font-weight: bold; margin-bottom: var(--space-md);">0% Accuracy</div>

            <button onclick="showMenu()" class="reveal-btn" style="background: var(--accent-blue); box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);">
                <i class="fa-solid fa-rotate-left"></i> Return to Menu
            </button>
        </div>
    </main>

    <script>
        /* =========================================
           DATA: 16 CYBERCRIME TERMS
           ========================================= */
        const termsData = [
            { en: "a denial-of-service attack (a DoS attack)", short: "a DoS attack", ru: "DoS-атака (сетевая атака)", def: "is a cyber attack carried out with one Internet-connected device and aimed to disrupt legitimate users’ access to a target network or web resource." },
            { en: "a distributed denial-of-service attack (a DDoS attack)", short: "a DDoS attack", ru: "DDoS-атака (распределённая сетевая атака)", def: "is a cyber attack carried out with networks of Internet-connected machines and aimed to disrupt legitimate users’ access to a target network or web resource." },
            { en: "a malware attack", short: "a malware attack", ru: "хакерская атака с использованием вредоносного ПО", def: "is a cyber attack where malicious software, commonly known as malware, is used to gain unauthorized access to a computer system or network." },
            { en: "a social engineering attack", short: "a social engineering attack", ru: "атака с помощью социальной инженерии", def: "is a type of cyber attack that uses psychological manipulation and lies to trick people into giving up sensitive information or doing things that could compromise security." },
            { en: "spoofing", short: "spoofing", ru: "спуфинг (от англ. spoof – подменять, имитировать)", def: "is the creation and use of fake messages, emails, sites, etc." },
            { en: "phishing", short: "phishing", ru: "фишинг («выуживание»)", def: "is a type of social engineering attack and a scam that targets users by sending fake messages, emails, and links to get sensitive information about them." },
            { en: "vishing (= voice phishing)", short: "vishing", ru: "вишинг (голосовой фишинг)", def: "is the use of fraudulent phone calls to trick victims into providing personal information (login credentials, credit card numbers, or bank details)." },
            { en: "identity theft", short: "identity theft", ru: "хищение персональных данных", def: "is stealing somebody’s personal details (login credentials, bank account numbers, etc.)." },
            { en: "identity fraud", short: "identity fraud", ru: "мошенничество с использованием похищенных персональных данных", def: "is the use of stolen personal details (login credentials, bank account numbers, etc.) to commit fraud." },
            { en: "cyber extortion", short: "cyber extortion", ru: "кибервымогательство, кибершантаж", def: "is the demand for money by cybercriminals to give back important data they have stolen or to stop malicious activities such as DDoS attacks." },
            { en: "copyright infringement", short: "copyright infringement", ru: "нарушение авторских прав", def: "is the unauthorized use, reproduction, distribution, or adaptation of material protected by copyright law, violating the owner's exclusive rights." },
            { en: "cryptojacking", short: "cryptojacking", ru: "криптоджекинг (майнинг криптовалют с использованием чужих ресурсов)", def: "is the act of exploiting a computer to mine cryptocurrencies, often through websites, against the user's will or while the user is unaware." },
            { en: "cyber stalking", short: "cyber stalking", ru: "киберпреследование, кибердомогательство", def: "is the use of the Internet, social media, or other electronic technologies to repeatedly threaten or intimidate an individual." },
            { en: "swatting", short: "swatting", ru: "сваттинг (заведомо ложное сообщение об опасности)", def: "is the action of making hoax phone calls to report serious crimes to police or emergency services." },
            { en: "cyber espionage", short: "cyber espionage", ru: "кибершпионаж", def: "is the unlawful access to government or company data." },
            { en: "cyber terrorism", short: "cyber terrorism", ru: "кибертерроризм", def: "is an act of terrorism committed by the use of cyberspace or computers." }
        ];

        /* =========================================
           UI NAVIGATION
           ========================================= */
        const elMenu = document.getElementById('main-menu');
        const elTerm = document.getElementById('term-container');
        const elMatch = document.getElementById('match-container');
        const elResults = document.getElementById('results-container');

        function showMenu() {
            stopTimer();
            elMenu.classList.remove('hidden');
            elTerm.classList.add('hidden');
            elMatch.classList.add('hidden');
            elResults.classList.add('hidden');
        }

        /* =========================================
           SPEECH SYNTHESIS (BRITISH ENGLISH)
           ========================================= */
        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            const voices = window.speechSynthesis.getVoices();
            const british = voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
            if (british) utterance.voice = british;
            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        /* =========================================
           MODE 1: TERMINOLOGY STUDY
           ========================================= */
        let currentTermIndex = 0;

        function startTerminology() {
            currentTermIndex = 0;
            elMenu.classList.add('hidden');
            elTerm.classList.remove('hidden');
            elMatch.classList.add('hidden');
            elResults.classList.add('hidden');
            loadTerm();
        }

        function loadTerm() {
            const data = termsData[currentTermIndex];

            document.getElementById('term-en').innerHTML =
                `<span>${data.en}</span>
                 <button class="speak-btn" title="Listen to pronunciation" onclick="speak('${data.en.replace(/'/g, "\\'")}')">
                     <i class="fa-solid fa-volume-high"></i>
                 </button>`;
            document.getElementById('term-def').innerText = data.def;
            document.getElementById('term-ru').innerText = data.ru;

            const ruContainer = document.getElementById('term-ru-container');
            ruContainer.classList.add('hidden');
            ruContainer.style.animation = 'none';
            ruContainer.offsetHeight;
            ruContainer.style.animation = null;

            document.getElementById('btn-reveal').classList.remove('hidden');
            document.getElementById('term-progress').innerText = `${currentTermIndex + 1}/${termsData.length}`;
            document.getElementById('btn-prev-term').disabled = currentTermIndex === 0;

            const nextBtn = document.getElementById('btn-next-term');
            if (currentTermIndex === termsData.length - 1) {
                nextBtn.innerHTML = '<i class="fa-solid fa-check"></i> Finish';
            } else {
                nextBtn.innerHTML = 'Next <i class="fa-solid fa-arrow-right"></i>';
            }
        }

        function revealTranslation() {
            document.getElementById('btn-reveal').classList.add('hidden');
            document.getElementById('term-ru-container').classList.remove('hidden');
        }

        function nextTerm() {
            if (currentTermIndex < termsData.length - 1) {
                currentTermIndex++;
                loadTerm();
            } else {
                showMenu();
            }
        }

        function prevTerm() {
            if (currentTermIndex > 0) {
                currentTermIndex--;
                loadTerm();
            }
        }

        /* =========================================
           MODE 2: TIMED MATCHING
           ========================================= */
        const MATCH_SECONDS = 60;
        let matchScore = 0;
        let matchAnswered = 0;
        let matchCorrect = 0;
        let matchQuestions = [];
        let matchIndex = 0;
        let timeLeft = MATCH_SECONDS;
        let timerInterval = null;
        let answerLocked = false;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function buildMatchQuestions() {
            return shuffleArray(termsData).map(item => {
                const wrong = shuffleArray(termsData.filter(t => t.short !== item.short)).slice(0, 3);
                return {
                    definition: item.def,
                    correct: item.short,
                    options: shuffleArray([item.short, ...wrong.map(t => t.short)])
                };
            });
        }

        function startMatching() {
            matchScore = 0;
            matchAnswered = 0;
            matchCorrect = 0;
            matchIndex = 0;
            timeLeft = MATCH_SECONDS;
            answerLocked = false;
            matchQuestions = buildMatchQuestions();

            elMenu.classList.add('hidden');
            elTerm.classList.add('hidden');
            elResults.classList.add('hidden');
            elMatch.classList.remove('hidden');

            document.getElementById('match-score').innerText = 'Score: 0';
            updateMatchTimer();
            loadMatchQuestion();
            startTimer();
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateMatchTimer();
                if (timeLeft <= 0) {
                    stopTimer();
                    showResults();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateMatchTimer() {
            const m = Math.floor(Math.max(timeLeft, 0) / 60).toString().padStart(2, '0');
            const s = (Math.max(timeLeft, 0) % 60).toString().padStart(2, '0');
            const timerEl = document.getElementById('match-timer');
            timerEl.innerText = `${m}:${s}`;
            timerEl.classList.toggle('danger', timeLeft <= 10);
        }

        function loadMatchQuestion() {
            if (matchIndex >= matchQuestions.length) {
                matchQuestions = buildMatchQuestions();
                matchIndex = 0;
            }

            answerLocked = false;
            const q = matchQuestions[matchIndex];
            document.getElementById('match-progress').innerText = `${matchIndex + 1}/${matchQuestions.length}`;
            document.getElementById('match-question').innerText = q.definition;

            const optionsContainer = document.getElementById('match-options');
            optionsContainer.innerHTML = '';

            q.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option.charAt(0).toUpperCase() + option.slice(1);
                btn.onclick = () => checkMatchAnswer(option, q.correct, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkMatchAnswer(selected, correct, btnElement) {
            if (answerLocked) return;
            answerLocked = true;
            matchAnswered++;

            const allButtons = document.getElementById('match-options').children;
            for (const btn of allButtons) btn.disabled = true;

            if (selected === correct) {
                matchScore++;
                matchCorrect++;
                btnElement.classList.add('correct');
                document.getElementById('match-score').innerText = `Score: ${matchScore}`;
            } else {
                btnElement.classList.add('wrong');
                for (const btn of allButtons) {
                    if (btn.innerText.toLowerCase() === correct.toLowerCase()) {
                        btn.classList.add('correct');
                    }
                }
            }

            setTimeout(() => {
                matchIndex++;
                if (timeLeft > 0) loadMatchQuestion();
            }, 650);
        }

        function showResults() {
            stopTimer();
            elMatch.classList.add('hidden');
            elResults.classList.remove('hidden');

            const percentage = matchAnswered > 0 ? Math.round((matchCorrect / matchAnswered) * 100) : 0;
            document.getElementById('res-score').innerText = `${matchScore}`;
            document.getElementById('res-detail').innerText = `${matchCorrect} correct / ${matchAnswered - matchCorrect} incorrect`;
            document.getElementById('res-percent').innerText = `${percentage}% Accuracy (${matchCorrect}/${matchAnswered})`;

            setTimeout(() => {
                const bar = document.getElementById('res-bar');
                bar.style.width = `${percentage}%`;
                if (percentage >= 80) bar.style.background = 'var(--accent-green)';
                else if (percentage >= 50) bar.style.background = '#facc15';
                else bar.style.background = 'var(--accent-red)';
            }, 100);
        }
    </script>
</body>
</html>
